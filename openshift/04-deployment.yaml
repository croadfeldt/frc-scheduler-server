---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: NAMESPACE_PLACEHOLDER
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app: NAMESPACE_PLACEHOLDER-git
spec:
  replicas: 2
  selector:
    matchLabels:
      app: NAMESPACE_PLACEHOLDER-git
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: NAMESPACE_PLACEHOLDER-git
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: NAMESPACE_PLACEHOLDER-git
      securityContext:
        runAsNonRoot: true
      volumes:
        - name: tls-certs
          secret:
            secretName: frc-scheduler-tls
        # Apple Sign-In domain-association file. The ConfigMap
        # `frc-apple-domain-association` is OPTIONAL — when Apple
        # sign-in isn't being used, the ConfigMap doesn't need to
        # exist. The `optional: true` flag prevents the deployment
        # from failing when the resource is absent. Apple's
        # verifier reads this file at:
        #   https://YOUR_HOST/.well-known/apple-developer-domain-association
        # See docs/OAUTH_SETUP.md for how to obtain the file from
        # Apple's developer portal and create the ConfigMap.
        - name: apple-domain-association
          configMap:
            name: frc-apple-domain-association
            optional: true
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              echo "Waiting for postgres at frc-postgres:5432..."
              until pg_isready -h frc-postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                echo "  postgres not ready — retrying in 3s..."
                sleep 3
              done
              echo "Postgres is ready and database '$POSTGRES_DB' exists."
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: frc-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: frc-db-secret
                  key: POSTGRES_DB
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: NAMESPACE_PLACEHOLDER
          image: image-registry.openshift-image-registry.svc:5000/NAMESPACE_PLACEHOLDER/NAMESPACE_PLACEHOLDER-git:latest
          imagePullPolicy: Always
          volumeMounts:
            - name: tls-certs
              mountPath: /certs
              readOnly: true
            # Apple domain-association file mount. When the
            # ConfigMap exists, the file is mounted at
            # /etc/apple-domain-association/apple-developer-domain-association
            # and APPLE_DOMAIN_ASSOCIATION_FILE points the server at it.
            # When the ConfigMap is absent (most deployments), the
            # mount is empty and the env var still points to a
            # nonexistent file — the route returns 404, which is
            # the correct behavior for a server not using Apple
            # sign-in.
            - name: apple-domain-association
              mountPath: /etc/apple-domain-association
              readOnly: true
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: frc-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frc-db-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: frc-db-secret
                  key: POSTGRES_DB
            - name: POSTGRES_HOST
              value: "frc-postgres"
            - name: POSTGRES_PORT
              value: "5432"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: frc-db-secret
                  key: DATABASE_URL
            - name: TBA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: frc-app-secret
                  key: TBA_API_KEY
            - name: NEXUS_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: frc-app-secret
                  key: NEXUS_WEBHOOK_TOKEN
                  optional: true
            # Nexus pull-mode API key. When set, a background task periodically
            # GETs Nexus's pull endpoint with this key in the Nexus-Api-Key header.
            # Optional — push mode (webhooks above) covers the same data.
            - name: NEXUS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: frc-app-secret
                  key: NEXUS_API_KEY
                  optional: true
            # LLM endpoint for PDF schedule import. All three are optional —
            # the PDF import button stays hidden when LLM_ENDPOINT is empty.
            # See docs/INTEGRATIONS.md for setup.
            - name: LLM_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: frc-app-secret
                  key: LLM_ENDPOINT
                  optional: true
            - name: LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: frc-app-secret
                  key: LLM_MODEL
                  optional: true
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: frc-app-secret
                  key: LLM_API_KEY
                  optional: true
            - name: CPU_WORKERS
              value: "CPU_WORKERS_PLACEHOLDER"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: APP_PORT
              value: "APP_PORT_PLACEHOLDER"
            - name: WEB_WORKERS
              value: "WEB_WORKERS_PLACEHOLDER"
            - name: SSL_CERTFILE
              value: "/certs/tls.crt"
            - name: SSL_KEYFILE
              value: "/certs/tls.key"
            - name: ALLOWED_ORIGINS
              value: "ALLOWED_ORIGINS_PLACEHOLDER"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: frc-auth-secret
                  key: JWT_SECRET
            - name: BASE_URL
              valueFrom:
                secretKeyRef:
                  name: frc-auth-secret
                  key: BASE_URL
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: frc-auth-secret
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: frc-auth-secret
                  key: GOOGLE_CLIENT_SECRET
            # Apple Sign-In — all four vars must be set together.
            # Empty strings are tolerated (auth.py treats Apple as
            # disabled when APPLE_PRIVATE_KEY is empty), so leaving
            # the secret keys at "" disables Apple sign-in without
            # breaking startup. The .p8 private key supports both
            # literal newlines and escaped \n sequences in the
            # secret value — auth.py normalizes both.
            - name: APPLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: frc-auth-secret
                  key: APPLE_CLIENT_ID
            - name: APPLE_TEAM_ID
              valueFrom:
                secretKeyRef:
                  name: frc-auth-secret
                  key: APPLE_TEAM_ID
            - name: APPLE_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: frc-auth-secret
                  key: APPLE_KEY_ID
            - name: APPLE_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: frc-auth-secret
                  key: APPLE_PRIVATE_KEY
            # Path the server reads to serve Apple's domain-association
            # file. Always set; when the ConfigMap is absent the file
            # doesn't exist and the route returns 404. Match this path
            # to the volumeMount above plus the ConfigMap key name.
            - name: APPLE_DOMAIN_ASSOCIATION_FILE
              value: "/etc/apple-domain-association/apple-developer-domain-association"
            # Comma-separated email allow-list for admin role.
            # Users whose email matches get is_admin=true on next
            # login. Interim: replaced by RBAC role grants per
            # docs/RBAC_MODEL.md when that ships. Removing an email
            # from this list does NOT auto-revoke admin status —
            # that requires direct DB UPDATE.
            - name: ADMIN_EMAILS
              valueFrom:
                secretKeyRef:
                  name: frc-auth-secret
                  key: ADMIN_EMAILS
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /api/health
              port: 8443
              scheme: HTTPS
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 0
            periodSeconds: 5
          resources:
            requests:
              cpu: "4"
              memory: "1Gi"
            limits:
              cpu: "12"
              memory: "4Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: NAMESPACE_PLACEHOLDER
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app: NAMESPACE_PLACEHOLDER-git
  annotations:
    # MetalLB: request a specific IP from the server-vlan pool
    metallb.universe.tf/loadBalancerIPs: METALLB_IP_PLACEHOLDER
    metallb.universe.tf/address-pool: METALLB_POOL_PLACEHOLDER
spec:
  type: LoadBalancer
  selector:
    app: NAMESPACE_PLACEHOLDER-git
  ports:
    - name: https
      port: 8088
      targetPort: 8443
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: NAMESPACE_PLACEHOLDER-pdb
  namespace: NAMESPACE_PLACEHOLDER
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: NAMESPACE_PLACEHOLDER-git
